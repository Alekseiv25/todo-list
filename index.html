<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-do list</title>
    <link rel="stylesheet" href="./src/styles/main.scss">
    <script>
        // Apply the saved/system theme before first paint (src/ts/app.ts owns the toggle).
        try { var t = localStorage.getItem("TODO-LIST-THEME"); } catch (e) {}
        document.documentElement.dataset.theme = t === "light" || t === "dark" ? t
            : matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    </script>
</head>

<body>
    <main id="root"></main>
    <script type="module" src="./src/ts/main.ts"></script>
</body>

</html>
